#
# Curated OpenRewrite recipe set for aroxy.
#
# The build checks this composite rather than applying it: rewrite:dryRun runs at process-resources and
# fails when a recipe would change a source file, writing the patch it would have applied to
# target/rewrite/rewrite.patch. `mvn process-resources -Pformat` applies it instead (see pom.xml).
#
# The recipe set is curated to be deterministic and non-conflicting: it carries no formatting or import
# recipes, which are owned by the formatter and impsort, so OpenRewrite contributes only the semantic
# change and the Eclipse formatter stays the source of truth for style.
#
---
type: specs.openrewrite.org/v1beta/recipe
name: eu.ciechanowiec.aroxy.Modernization
displayName: aroxy modernization
description: >-
  Curated, non-conflicting OpenRewrite recipes for aroxy: broad static-analysis cleanups,
  modernization to current Java idioms, JUnit 5 / SLF4J best practices, and Maven pom hygiene.
recipeList:
  # Broad, auto-fixable static-analysis cleanups (idiomatic Java, dead code, simplifications).
  - org.openrewrite.staticanalysis.CommonStaticAnalysis
  # Modernize toward current Java language idioms (text blocks, enhanced instanceof, records, etc.),
  # at the release the project compiles against.
  - org.openrewrite.java.migrate.UpgradeToJava25
  # JUnit 5 best practices (lifecycle/visibility, assertion idioms). The project uses plain JUnit 5.
  - org.openrewrite.java.testing.junit5.JUnit5BestPractices
  # SLF4J best practices, expanded inline from org.openrewrite.java.logging.slf4j.Slf4jBestPractices
  # so specific sub-recipes can be left out. Excluded:
  #   * CatchBlockLogLevel       -- keep deliberate warn-vs-error choices in catch blocks
  #   * CompleteExceptionLogging -- keep terse getMessage() logging where chosen; do not auto-append
  #                                 the throwable (and thus a full stack trace) to every catch-block log
  # Everything else is retained, including WrapExpensiveLogStatementsInConditionals (fluent lazy-arg form).
  - org.openrewrite.java.logging.ArgumentArrayToVarargs
  - org.openrewrite.java.logging.slf4j.LoggersNamedForEnclosingClass
  - org.openrewrite.java.logging.slf4j.Slf4jLogShouldBeConstant
  - org.openrewrite.java.logging.slf4j.StringFormatToParameterizedLogging
  - org.openrewrite.java.logging.slf4j.MessageFormatToParameterizedLogging
  - org.openrewrite.java.logging.slf4j.ParameterizedLogging
  - org.openrewrite.java.logging.ChangeLoggersToPrivate
  - org.openrewrite.java.logging.slf4j.MatchIsLogLevelEnabledWithLogStatements
  - org.openrewrite.java.logging.slf4j.WrapExpensiveLogStatementsInConditionals
  - org.openrewrite.java.logging.slf4j.StripToStringFromArguments
  - org.openrewrite.java.logging.slf4j.RemoveUnnecessaryLogLevelGuards
  # Maven pom hygiene (ordering, redundant version removal, etc.).
  - org.openrewrite.maven.BestPractices
#
# Recipe modules to add here if/when these technologies enter the project. Each is a separate
# org.openrewrite.recipe:* plugin dependency (pin the version via rewrite-recipe-bom) plus the relevant
# recipe added to the recipeList above. Verify exact recipe ids against https://docs.openrewrite.org/recipes
# when adding -- the catalog evolves and names change.
#   * Spring / Spring Boot       -> rewrite-spring             (e.g. UpgradeSpringBoot_3_x, SpringBootBestPractices)
#   * Mockito / AssertJ in tests -> rewrite-testing-frameworks (already a dependency; add the Mockito*/Assertj* recipes)
#   * Log4j2 / Logback / JUL     -> rewrite-logging-frameworks (already a dependency; add the migration recipes)
#   * Jackson                    -> rewrite-jackson
#   * Hibernate / JPA            -> rewrite-hibernate
#   * Quarkus                    -> rewrite-quarkus
#   * Micronaut                  -> rewrite-micronaut
#   * Apache Commons / libs      -> rewrite-apache
#   * Dockerfile                 -> rewrite-docker
#   * Kubernetes manifests       -> rewrite-kubernetes
#   * Terraform                  -> rewrite-terraform
#   * GitHub Actions workflows   -> rewrite-github-actions
#   * Jenkins pipelines          -> rewrite-jenkins
#   * OpenAPI specs              -> rewrite-openapi
#   * Security hardening (any)   -> rewrite-java-security      (mostly find/report -- review before applying)
