# =============================================================================
#  aroxy default configuration  -  bundled, generic, "fits all".
# =============================================================================
#
#  This file ships inside the aroxy jar and is materialized to ~/.aroxy/default.conf
#  on first run. It is ALWAYS loaded on start. You may edit it, or empty it, and you
#  may layer machine-wide (persistent) and per-session (temporary) config files on top.
#
#  Format: stanzas opened by [gateway] or [rule]; "key = value" lines; "#" = comment.
#  Regex patterns are verbatim - do NOT escape backslashes (surrounding whitespace is trimmed,
#  so anchor a leading or trailing space with \s when a pattern needs one). Later files override
#  earlier ones: a [gateway] key takes its last value; a [rule] is replaced when its id reappears.
#
#  Rule keys:
#    id          a unique name, also shown in the audit log
#    enabled     true or false
#    type        regex or literal
#    placeholder the name in the token <<PII:PLACEHOLDER:N>>; must be one of the names already
#                used below (API_KEY, AWS_KEY, COMPANY, DSN, EMAIL, GH_TOKEN, INTDOMAIN, INTIP,
#                INTURL, JWT, PHONE, PRIVKEY, PROJECT, SECRET, SLACK_TOKEN). These names survive the
#                model round trip; any other placeholder makes the whole file broken, so it is not
#                loaded. Reuse the fitting one (COMPANY for any company, PROJECT for a codename, ...).
#    pattern     for a regex rule, the regular expression, verbatim
#    value       for a literal rule, the text to replace, matched as a substring anywhere,
#                with no word boundary (a rule for "acme" also hits acme.com; use a regex
#                rule with \b when you need a word boundary)
#    sensitive   true masks the value in the audit log; use it for secrets
#    flags       any of i (ignore case), s (dot matches newline), m (multiline)
#    loose       for a literal rule, also match respellings with separators between letters
#    leet        for a literal rule, also match digit look-alikes, such as o as 0
#
#  Only id, placeholder, and pattern (regex) or value (literal) are required. Every other key is
#  optional and defaults to: enabled=true, type=regex, sensitive=false, flags=none, loose=false,
#  leet=false. Those keys are the only ones a [rule] takes: any other key, or a value that names
#  nothing usable, breaks the file, so a typo is reported rather than silently ignored.

[gateway]
# The keys of this stanza are listen_claude, listen_codex, and mask_secrets. Any other key breaks this
# file, as does a value that names nothing usable: a key you write states an intent, so a typo is reported
# rather than silently ignored. Leave a key out to accept its default.
#
# aroxy serves one agent per listener, each on its own port, so a request never has to be routed by
# guessing which vendor a path belongs to. One daemon runs them all, sharing one vault, one rule set,
# and one audit log: a secret carries the same token whichever agent sends it.
#   listen_claude Claude Code, forwarded to https://api.anthropic.com
#   listen_codex  Codex CLI signed in with ChatGPT, forwarded to https://chatgpt.com/backend-api/codex
# Each is the port only; the proxy always binds the local interface 127.0.0.1, and a host:port value is
# read for its port alone. Each upstream is fixed per agent and is not configurable. Two agents given
# the same port breaks this file, since only one of them could ever bind it.
listen_claude = 8788
listen_codex  = 8789
mask_secrets  = true

# =============================================================================
#  Secrets & credentials  (enabled by default; masked in the audit log)
# =============================================================================

[rule]
id          = private_key
enabled     = true
type        = regex
placeholder = PRIVKEY
sensitive   = true
flags       = s
pattern     = -----BEGIN (?:RSA |EC |DSA |OPENSSH |PGP )?PRIVATE KEY-----[\s\S]*?-----END (?:RSA |EC |DSA |OPENSSH |PGP )?PRIVATE KEY-----

[rule]
id          = aws_access_key
enabled     = true
type        = regex
placeholder = AWS_KEY
sensitive   = true
pattern     = (?:AKIA|ASIA)[0-9A-Z]{16}

[rule]
id          = github_token
enabled     = true
type        = regex
placeholder = GH_TOKEN
sensitive   = true
pattern     = gh[posru]_[A-Za-z0-9]{36,}

[rule]
id          = slack_token
enabled     = true
type        = regex
placeholder = SLACK_TOKEN
sensitive   = true
pattern     = xox[baprs]-[A-Za-z0-9-]{10,}

[rule]
id          = api_key_like
enabled     = true
type        = regex
placeholder = API_KEY
sensitive   = true
pattern     = sk-(?:ant-)?[A-Za-z0-9_-]{20,}

[rule]
id          = jwt
enabled     = true
type        = regex
placeholder = JWT
sensitive   = true
pattern     = eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+

[rule]
id          = connection_string
enabled     = true
type        = regex
placeholder = DSN
sensitive   = true
pattern     = [a-z][a-z0-9+.-]*://[^\s:@/"]+:[^\s:@/"]+@[^\s/"]+

# Replaces a password= / secret: / api_key= / token= assignment, value and all. The value class
# excludes \ . ( ) [ ] { } so the match cannot run past a backslash-escaped newline in the JSON wire
# body (which would eat the next line's cat -n number) nor swallow code like `token = obj.method()`
# or `x == token:`; dotted/structured secrets (JWT, DSN, email) are covered by their own rules above.
[rule]
id          = generic_secret
enabled     = true
type        = regex
placeholder = SECRET
sensitive   = true
flags       = i
pattern     = (?:password|passwd|secret|api[_-]?key|token)\s*[=:]\s*[^\s"'.()\[\]{}\\]{6,}

# =============================================================================
#  Corporate identifiers  (TEMPLATES, disabled. aroxy can't know the company, so nothing here
#  is obfuscated until you set a value and enabled = true. The values below are only
#  examples. Two rules of each kind are shown so you can see how to add several: copy a [rule]
#  stanza, give it a unique id, and add as many as you need. Several rules can share one
#  placeholder (e.g. every company uses COMPANY).)
# =============================================================================

[rule]
id          = company_acme
enabled     = false
type        = literal
placeholder = COMPANY
flags       = i
loose       = true
value       = Acme Corporation

[rule]
id          = company_globex
enabled     = false
type        = literal
placeholder = COMPANY
flags       = i
loose       = true
value       = Globex Corporation

[rule]
id          = domain_acme
enabled     = false
type        = regex
placeholder = INTDOMAIN
pattern     = [A-Za-z0-9.-]+\.acme-internal\.net

[rule]
id          = domain_globex
enabled     = false
type        = regex
placeholder = INTDOMAIN
pattern     = [A-Za-z0-9.-]+\.globex-internal\.net

[rule]
id          = project_helios
enabled     = false
type        = literal
placeholder = PROJECT
flags       = i
loose       = true
value       = Project Helios

[rule]
id          = project_venus
enabled     = false
type        = literal
placeholder = PROJECT
flags       = i
loose       = true
value       = Project Venus

# =============================================================================
#  Classic PII  (shipped DISABLED - flip enabled = true to turn on)
# =============================================================================

[rule]
id          = email
enabled     = false
type        = regex
placeholder = EMAIL
pattern     = [A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}

[rule]
id          = phone
enabled     = false
type        = regex
placeholder = PHONE
pattern     = \+?\d[\d ()-]{7,}\d

# =============================================================================
#  Internal network details  (shipped DISABLED - higher false-positive risk)
# =============================================================================

[rule]
id          = internal_ip
enabled     = false
type        = regex
placeholder = INTIP
pattern     = \b(?:10|127)(?:\.\d{1,3}){3}\b|\b192\.168(?:\.\d{1,3}){2}\b|\b172\.(?:1[6-9]|2\d|3[01])(?:\.\d{1,3}){2}\b

[rule]
id          = internal_url
enabled     = false
type        = regex
placeholder = INTURL
pattern     = https?://[A-Za-z0-9.-]*\.corp(?:[:/][^\s"]*)?
