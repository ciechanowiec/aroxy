name: 'Verify'

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: 'Extended verification'
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    steps:
      - name: 'Checkout (full history for the whole-history gates)'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # The commit-message, typography, and gitleaks checks read the entire history.
          fetch-depth: 0

      - name: 'Set up JDK from .java-version'
        uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07 # v4
        with:
          distribution: 'temurin'
          java-version-file: '.java-version'
          cache: 'maven'

      - name: 'Install Maven 3.10.0'
        uses: ./.github/actions/install-maven

      - name: 'Install the pinned report browser'
        uses: ./.github/actions/install-report-browser

      - name: 'Extended verification (mvn clean verify -Pextended)'
        # Docker is preinstalled on GitHub-hosted ubuntu runners for Gitleaks and Qodana.
        run: mvn --batch-mode --no-transfer-progress clean verify -Pextended
