name: 'Publish Maven Central release'

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Version already declared in pom.xml'
        required: true
        default: '1.0.4-SNAPSHOT'
        type: string
      publish:
        description: 'Publish permanently after Extended verification'
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: 'maven-central-release'
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-26.04
    timeout-minutes: 180
    environment: maven-central
    steps:
      - name: 'Checkout complete history'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: 'Validate release request'
        env:
          CONFIRM_PUBLISH: ${{ inputs.publish }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -eu
          if [ "$GITHUB_REF" != 'refs/heads/main' ]; then
            echo 'Run releases from the main branch.' >&2
            exit 1
          fi
          if [ "$CONFIRM_PUBLISH" != 'true' ]; then
            echo 'Permanent publication was not confirmed.' >&2
            exit 1
          fi
          if ! [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo 'The release version must be a semantic version.' >&2
            exit 1
          fi
          if [[ "$RELEASE_VERSION" == *-SNAPSHOT ]]; then
            echo 'Maven Central releases cannot use a SNAPSHOT version.' >&2
            exit 1
          fi
          if grep -q 'readonly RELEASE_VERSION=' install.sh; then
            echo 'install.sh must resolve the newest Maven Central release, not pin a version.' >&2
            exit 1
          fi

      - name: 'Validate release secrets'
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -eu
          test -n "$MAVEN_CENTRAL_USERNAME" || { echo 'MAVEN_CENTRAL_USERNAME is missing.' >&2; exit 1; }
          test -n "$MAVEN_CENTRAL_PASSWORD" || { echo 'MAVEN_CENTRAL_PASSWORD is missing.' >&2; exit 1; }
          test -n "$GPG_PRIVATE_KEY" || { echo 'GPG_PRIVATE_KEY is missing.' >&2; exit 1; }
          test -n "$MAVEN_GPG_PASSPHRASE" || { echo 'GPG_PASSPHRASE is missing.' >&2; exit 1; }

      - name: 'Set up Temurin and Maven Central credentials from .java-version'
        uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07 # v4
        with:
          distribution: 'temurin'
          java-version-file: '.java-version'
          cache: 'maven'
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: 'Install Maven 3.10.0'
        uses: ./.github/actions/install-maven

      - name: 'Validate declared version and Central availability'
        id: release_state
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -eu
          declared_version="$(mvn --quiet help:evaluate -Dexpression=project.version -DforceStdout)"
          if [ "$declared_version" != "$RELEASE_VERSION" ]; then
            echo "pom.xml declares $declared_version, not $RELEASE_VERSION." >&2
            exit 1
          fi
          artifact_url="https://repo.maven.apache.org/maven2/eu/ciechanowiec/aroxy/$RELEASE_VERSION/aroxy-$RELEASE_VERSION.pom"
          status="$(curl --silent --output /dev/null --write-out '%{http_code}' "$artifact_url")"
          if [ "$status" = '200' ]; then
            echo 'central_published=true' >> "$GITHUB_OUTPUT"
            echo "Maven Central already contains $RELEASE_VERSION; recovering GitHub metadata."
            exit 0
          fi
          if [ "$status" != '404' ]; then
            echo "Maven Central availability check returned HTTP $status." >&2
            exit 1
          fi
          echo 'central_published=false' >> "$GITHUB_OUTPUT"

      - name: 'Install the pinned report browser'
        if: steps.release_state.outputs.central_published != 'true'
        uses: ./.github/actions/install-report-browser

      - name: 'Run Extended verification'
        if: steps.release_state.outputs.central_published != 'true'
        run: mvn --batch-mode --no-transfer-progress clean verify -Pextended

      - name: 'Publish signed artifacts'
        id: publish
        if: steps.release_state.outputs.central_published != 'true'
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: mvn --batch-mode --no-transfer-progress deploy -Prelease -DskipTests

      - name: 'Create and push release tag'
        id: release_tag
        if: >-
          steps.release_state.outputs.central_published == 'true' ||
          steps.publish.outcome == 'success'
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -eu
          tag="v$RELEASE_VERSION"
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            tag_commit="$(git rev-list --max-count=1 "$tag")"
            if [ "$tag_commit" != "$GITHUB_SHA" ]; then
              echo "Tag $tag already identifies another commit." >&2
              exit 1
            fi
            echo "Tag $tag already identifies this commit."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag --annotate "$tag" --message "Release $RELEASE_VERSION"
          git push origin "refs/tags/$tag"

      - name: 'Wait for Maven Central availability'
        if: steps.publish.outcome == 'success'
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -eu
          base="https://repo.maven.apache.org/maven2/eu/ciechanowiec/aroxy"
          for attempt in {1..60}; do
            pom_status="$(curl --silent --output /dev/null --write-out '%{http_code}' "$base/$RELEASE_VERSION/aroxy-$RELEASE_VERSION.pom")"
            jar_status="$(curl --silent --output /dev/null --write-out '%{http_code}' "$base/$RELEASE_VERSION/aroxy-$RELEASE_VERSION.jar")"
            sum_status="$(curl --silent --output /dev/null --write-out '%{http_code}' "$base/$RELEASE_VERSION/aroxy-$RELEASE_VERSION.jar.sha256")"
            # The standalone installer reads maven-metadata.xml rather than a pinned version, so the
            # release is only reachable the documented way once that document names it too.
            latest="$(curl --silent --fail "$base/maven-metadata.xml" | grep -o '<release>[^<]*</release>' | sed -e 's|<release>||' -e 's|</release>||' || true)"
            if [ "$pom_status" = '200' ] && [ "$jar_status" = '200' ] && [ "$sum_status" = '200' ] && [ "$latest" = "$RELEASE_VERSION" ]; then
              exit 0
            fi
            echo "Maven Central is synchronizing (POM $pom_status, JAR $jar_status, SHA-256 $sum_status, metadata release '$latest'; attempt $attempt/60)."
            sleep 30
          done
          echo 'Maven Central did not become readable within 30 minutes.' >&2
          exit 1

      - name: 'Smoke-test the standalone installer'
        if: steps.publish.outcome == 'success'
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -eu
          isolated_home="$RUNNER_TEMP/aroxy-install-home"
          mkdir -p "$isolated_home" "$RUNNER_TEMP/aroxy-installer"
          cp install.sh uninstall.sh "$RUNNER_TEMP/aroxy-installer/"
          HOME="$isolated_home" SHELL=/bin/bash bash "$RUNNER_TEMP/aroxy-installer/install.sh"
          installed="$(HOME="$isolated_home" "$isolated_home/.local/bin/aroxy" --version | head -n 1)"
          if [ "$installed" != "aroxy $RELEASE_VERSION" ]; then
            echo "The standalone installer produced '$installed', not 'aroxy $RELEASE_VERSION'." >&2
            exit 1
          fi
          HOME="$isolated_home" bash "$RUNNER_TEMP/aroxy-installer/uninstall.sh"

      - name: 'Create metadata-only GitHub Release'
        if: >-
          always() &&
          steps.release_tag.outcome == 'success' &&
          (steps.release_state.outputs.central_published == 'true' || steps.publish.outcome == 'success')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -eu
          tag="v$RELEASE_VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "GitHub Release $tag already exists."
            exit 0
          fi
          gh release create "$tag" --verify-tag --title "Aroxy // $RELEASE_VERSION" --notes ''
