name: 'Release'

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'


      - name: Build the executable jar
        run: mvn -q clean package

      - name: Read the project version
        id: project
        run: echo "version=$(mvn -q -Dexec.executable=echo -Dexec.args='${project.version}' --non-recursive exec:exec -DforceStdout)" >> "$GITHUB_OUTPUT"

      - name: Publish a GitHub Release with the jar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.project.outputs.version }}
        run: |
          tag="v$VERSION"
          # Publish a SHA-256 next to the jar so the installer can verify the download's integrity.
          sha256sum target/aroxy.jar | awk '{print $1}' > target/aroxy.jar.sha256
          # Make the release reproducible: drop any existing release and tag for this version first.
          gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$tag" target/aroxy.jar target/aroxy.jar.sha256 \
            --title "aroxy $tag" \
            --notes "Executable jar (Java 25). Install with: curl -fsSL https://raw.githubusercontent.com/ciechanowiec/aroxy/main/install.sh | bash"
